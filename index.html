<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculus OS</title>
<link rel="stylesheet" href="css/desktop.css">
</head>
<body>
  <div class="menubar">
    <span class="menu"><b>Calculus OS</b></span>
    <span class="menu">File</span>
    <span class="menu">Edit</span>
    <span class="menu">View</span>
    <span class="menu">Special</span>
    <label class="snd"><input type="checkbox" id="sndToggle" checked> Sound</label>
    <span class="clock" id="clock" aria-label="Clock"></span>
  </div>

  <div class="desktop">
    <button class="icon" id="diffIcon" data-href="differentiator.html" aria-label="Open Differentiator">
      <span class="icon-pic" aria-hidden="true">
        <span class="icon-title"></span>
        <span class="icon-math">f&prime;(x)</span>
      </span>
      <span class="icon-label">Differentiator</span>
    </button>
    <button class="icon" id="simpIcon" data-href="simplifier.html" aria-label="Open Simplifier">
      <span class="icon-pic" aria-hidden="true">
        <span class="icon-title"></span>
        <span class="icon-math">&equiv;</span>
      </span>
      <span class="icon-label">Simplifier</span>
    </button>
    <button class="icon" id="intIcon" data-href="integrator.html" aria-label="Open Integrator">
      <span class="icon-pic" aria-hidden="true">
        <span class="icon-title"></span>
        <span class="icon-math">&int;</span>
      </span>
      <span class="icon-label">Integrator</span>
    </button>
  </div>

  <div class="flash" id="flash" aria-hidden="true"></div>

  <div class="cursor" id="cursor" aria-hidden="true">
    <svg width="17" height="25" viewBox="0 0 17 25" aria-hidden="true">
      <path d="M1 1 L1 18 L5.8 13.6 L8.4 19.6 L11 18.4 L8.4 12.4 L13.6 12.4 Z"
            fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
  </div>

<script src="js/desktop.js"></script>
</body>
</html>
