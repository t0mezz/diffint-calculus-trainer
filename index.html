<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Differentiator OS</title>
<link rel="stylesheet" href="css/desktop.css">
</head>
<body>
  <div class="menubar">
    <span class="menu"><b>Differentiator OS</b></span>
    <span class="menu">File</span>
    <span class="menu">Edit</span>
    <span class="menu">View</span>
    <span class="menu">Special</span>
    <label class="snd"><input type="checkbox" id="sndToggle" checked> Sound</label>
    <span class="clock" id="clock" aria-label="Clock"></span>
  </div>

  <div class="desktop">
    <button class="icon" id="diffIcon" aria-label="Open Differentiator">
      <span class="icon-pic" aria-hidden="true">
        <span class="icon-title"></span>
        <span class="icon-math">f&prime;(x)</span>
      </span>
      <span class="icon-label">Differentiator</span>
    </button>
  </div>

  <div class="flash" id="flash" aria-hidden="true"></div>

<script src="js/desktop.js"></script>
</body>
</html>
