<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integrator 1.0</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="window" role="main" aria-label="Integral trainer">
    <div class="titlebar">
      <span class="closebox" aria-hidden="true"></span>
      <h1>Integrator 1.0</h1>
      <span class="zoombox" aria-hidden="true"></span>
    </div>

    <div class="content">
      <div class="meta">
        <span id="ruleTag">Power rule</span>
        <span class="sep">&middot;</span>
        <span id="probNo">No. 001</span>
        <span class="sep">&middot;</span>
        <label class="range">Range:
          <select id="range" aria-label="Difficulty">
            <option value="warmup">Warm-up</option>
            <option value="steady" selected>Steady</option>
            <option value="spicy">Spicy</option>
          </select>
        </label>
      </div>

      <p class="find">Find the integral (omit +C) of</p>
      <div class="math problem" id="problem" aria-live="polite"></div>
      <p class="hint" id="hint"></p>

      <div class="answer-row">
        <span class="math">∫</span>
        <input id="answer" type="text" autocomplete="off" spellcheck="false"
               aria-label="Your antiderivative">
        <span class="math"><i class="v">dx</i></span>
      </div>
      <p class="feedback" id="feedback" aria-live="polite"></p>

      <div class="buttons">
        <button id="help" type="button" class="left">Help</button>
        <button id="reveal" type="button">Reveal</button>
        <button id="next" type="button">New Problem</button>
        <button id="check" type="button" class="default">Check</button>
      </div>

      <div class="ticket" id="helpbox" hidden>
        <b>Notation.</b> Type answers like
        <span class="math"><i class="v">x</i>^3 / 3</span> — use
        <b>x + - * / ^</b>, <b>sin cos tan exp log sqrt</b>, <b>pi</b>, <b>e</b>.
        Omit the constant: answer <span class="math"><i class="v">x</i>^2</span> for
        <span class="math">2<i class="v">x</i></span>, not
        <span class="math"><i class="v">x</i>^2 + C</span>
        (C does not parse). Any equal antiderivative counts.
      </div>

      <div class="ticket" id="ticket" hidden>
        <span class="ticket-x" aria-hidden="true"></span>
        <div id="ticketBody"></div>
      </div>

      <div class="statusbar">
        <span id="stats">Streak 0 &middot; Solved 0</span>
        <label class="sound"><input type="checkbox" id="sound" checked> Sound</label>
      </div>
    </div>
  </div>

<script src="js/algebra.js"></script>
<script src="js/intproblems.js"></script>
<script src="js/tex.js"></script>
<script src="js/intapp.js"></script>
</body>
</html>
